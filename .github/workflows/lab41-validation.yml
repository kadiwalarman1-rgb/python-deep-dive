name: Lab 41 Validation

on:
  push:
    paths:
      - "Lab 41/**"
      - ".github/workflows/lab41-validation.yml"
      - "README.md"
  pull_request:
    paths:
      - "Lab 41/**"
      - ".github/workflows/lab41-validation.yml"
      - "README.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Lab 41 scripts
        working-directory: Lab 41
        run: python -m compileall -q .
      - name: Run unit tests
        working-directory: Lab 41
        run: python -m unittest -v test_lab41.py
      - name: Run validation and demo scripts
        working-directory: Lab 41
        run: |
          python test_validation.py > /dev/null
          python test_direct_access.py > /dev/null
          python encapsulation_demo.py > /dev/null
          python person_class.py > /dev/null
          python person_with_properties.py > /dev/null
