name: AI DevOps Engineer CI

on:
  push:
    paths:
      - "projects/ai-powered-devops-engineer/**"
      - ".github/workflows/ai-devops-engineer-ci.yml"
  pull_request:
    paths:
      - "projects/ai-powered-devops-engineer/**"
      - ".github/workflows/ai-devops-engineer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: projects/ai-powered-devops-engineer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/ai-powered-devops-engineer/pyproject.toml
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest --cov=devops_ai --cov-report=term-missing
      - name: Python security scan
        run: bandit -r src app.py
      - name: Dependency audit
        run: pip-audit
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build local image
        run: docker build -t ai-powered-devops-engineer:test projects/ai-powered-devops-engineer
