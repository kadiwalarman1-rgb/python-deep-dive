name: AI DevOps Engineer CI

on:
  push:
    paths:
      - "projects/ai-powered-devops-engineer/**"
      - ".github/workflows/ai-devops-engineer-ci.yml"
  pull_request:
    paths:
      - "projects/ai-powered-devops-engineer/**"
      - ".github/workflows/ai-devops-engineer-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: projects/ai-powered-devops-engineer
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/ai-powered-devops-engineer/pyproject.toml
      - name: Install project and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Tests
        run: pytest --cov=devops_ai --cov-report=term-missing
      - name: Smoke test Streamlit startup
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/devops-ai-streamlit.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" >/dev/null 2>&1 || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health >/dev/null; then
              echo "Streamlit health endpoint responded."
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/devops-ai-streamlit.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/devops-ai-streamlit.log
          exit 1
      - name: Python security scan
        run: bandit -r src app.py
      - name: Dependency audit
        run: pip-audit --skip-editable
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build local image
        run: docker build -t ai-powered-devops-engineer:test projects/ai-powered-devops-engineer
      - name: Smoke test container startup
        run: |
          docker run --detach --name ai-powered-devops-smoke -p 127.0.0.1:8502:8501 ai-powered-devops-engineer:test
          cleanup() {
            docker logs ai-powered-devops-smoke || true
            docker rm --force ai-powered-devops-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8502/_stcore/health >/dev/null; then
              echo "Container health endpoint responded."
              exit 0
            fi
            if ! docker inspect --format '{{.State.Running}}' ai-powered-devops-smoke 2>/dev/null | grep -q true; then
              docker logs ai-powered-devops-smoke || true
              exit 1
            fi
            sleep 1
          done
          docker logs ai-powered-devops-smoke
          exit 1
