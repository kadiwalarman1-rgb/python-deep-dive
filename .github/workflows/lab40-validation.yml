name: Lab 40 Validation

on:
  push:
    paths:
      - "Lab 40/**"
      - ".github/workflows/lab40-validation.yml"
      - "README.md"
  pull_request:
    paths:
      - "Lab 40/**"
      - ".github/workflows/lab40-validation.yml"
      - "README.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Lab 40 scripts
        working-directory: Lab 40
        run: python -m compileall -q .
      - name: Run unit tests
        working-directory: Lab 40
        run: python -m unittest -v test_lab40.py
      - name: Run complete demonstration
        working-directory: Lab 40
        run: python shapes.py > /dev/null
