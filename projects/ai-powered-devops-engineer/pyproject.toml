[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-powered-devops-engineer"
version = "0.1.0"
description = "Local-first log analysis and optional AI-assisted incident triage."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = ["streamlit>=1.36,<2.0", "boto3>=1.34,<2.0", "python-dotenv>=1.0,<2.0"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "bandit>=1.7,<2.0",
  "pip-audit>=2.7,<3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["devops_ai"]
branch = true

[tool.coverage.report]
show_missing = true
